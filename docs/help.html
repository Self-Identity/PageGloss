<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PageGloss</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --fg: #131722;
      --dim: #5f6675;
      --border: #e3e7ef;
      --accent: #2f6df6;
      --accent-soft: rgba(47, 109, 246, .12);
      --code: #eef2f8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d;
        --surface: #1b1f27;
        --fg: #e9ecf3;
        --dim: #9aa3b2;
        --border: #2d323c;
        --accent: #6f9bff;
        --accent-soft: rgba(111, 155, 255, .18);
        --code: #20252f;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 18px 88px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 6px;
    }

    h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }

    .lang {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
    }

    .lang button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      height: 28px;
      padding: 0 12px;
      white-space: nowrap;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--dim);
      background: transparent;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang button[aria-pressed="true"] {
      color: #fff;
      background: var(--accent);
    }

    .lead { margin: 4px 0 22px; color: var(--dim); }

    section { margin: 22px 0; }

    h2 { font-size: 17px; margin: 0 0 8px; }

    p, li { overflow-wrap: anywhere; }

    ol, ul { margin: 0; padding-left: 22px; }

    li { margin: 6px 0; }

    code, kbd {
      padding: 1px 5px;
      border-radius: 5px;
      background: var(--code);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 13px;
    }

    kbd { border: 1px solid var(--border); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
    }

    th { font-size: 12.5px; color: var(--dim); }
    tr:last-child td { border-bottom: 0; }
    .nowrap { white-space: nowrap; }

    .hotkey {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .note {
      margin-top: 8px;
      padding: 9px 11px;
      color: var(--dim);
      background: var(--accent-soft);
      border-radius: 9px;
      font-size: 13.5px;
    }

    footer {
      margin-top: 30px;
      padding-top: 12px;
      color: var(--dim);
      font-size: 12.5px;
      border-top: 1px solid var(--border);
    }

    .github-chip {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100% - 32px);
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
      text-decoration: none;
      white-space: nowrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(16, 24, 40, .12);
    }

    .github-chip:hover,
    .github-chip:focus-visible {
      color: var(--fg);
      border-color: var(--accent);
    }

    .github-chip svg { width: 14px; height: 14px; flex: 0 0 auto; }

    @media (max-width: 560px) {
      .github-chip { right: 10px; bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title"></h1>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langZh" aria-pressed="false">中文</button>
        <button type="button" id="langEn" aria-pressed="false">English</button>
      </div>
    </header>
    <p class="lead" id="lead"></p>

    <section>
      <h2 id="stepsTitle"></h2>
      <ol id="steps"></ol>
      <p class="note" id="stepsNote"></p>
    </section>

    <section>
      <h2 id="unmarkTitle"></h2>
      <ul id="unmarkList"></ul>
    </section>

    <section>
      <h2 id="contextTitle"></h2>
      <p id="contextLead"></p>
      <table>
        <thead>
          <tr><th class="nowrap" id="ctxMode"></th><th id="ctxContent"></th></tr>
        </thead>
        <tbody id="contextRows"></tbody>
      </table>
    </section>

    <section>
      <h2 id="hotkeyTitle"></h2>
      <p id="hotkeyLine"></p>
      <p id="escLine"></p>
      <p class="note" id="hotkeyNote"></p>
    </section>

    <section>
      <h2 id="privacyTitle"></h2>
      <ul id="privacyList"></ul>
    </section>

    <footer id="footer"></footer>
  </main>

  <a class="github-chip" href="https://github.com/Self-Identity" target="_blank" rel="noopener noreferrer"
     title="github.com/Self-Identity" aria-label="GitHub: Self-Identity">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
      <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"></path>
    </svg>
    <span>GitHub · Self-Identity</span>
  </a>

  <script src="../src/shared/messages.js"></script>
  <script src="../src/shared/storage.js"></script>
  <script src="help.js"></script>
</body>
</html>
