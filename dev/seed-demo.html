<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageGloss 演示数据（dev）</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --fg: #131722;
      --dim: #5f6675;
      --border: #e3e7ef;
      --accent: #2f6df6;
      --accent-soft: rgba(47, 109, 246, .12);
      --danger: #c0392b;
      --danger-soft: rgba(192, 57, 43, .1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d;
        --surface: #1b1f27;
        --fg: #e9ecf3;
        --dim: #9aa3b2;
        --border: #2d323c;
        --accent: #6f9bff;
        --accent-soft: rgba(111, 155, 255, .16);
        --danger: #ff8f86;
        --danger-soft: rgba(255, 120, 110, .14);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font: 13.5px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .wrap {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 18px 60px;
      min-width: 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 21px;
      overflow-wrap: anywhere;
    }

    p {
      margin: 0 0 14px;
      color: var(--dim);
      overflow-wrap: anywhere;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
      min-width: 0;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      height: 34px;
      padding: 0 14px;
      white-space: nowrap;
      font: inherit;
      font-weight: 600;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-soft);
    }

    button.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    button.primary:hover {
      filter: brightness(1.06);
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .current {
      font-size: 12px;
      color: var(--dim);
      min-height: 1em;
    }

    .caveat {
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 12px;
      line-height: 1.55;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: .95em;
      color: var(--fg);
      overflow-wrap: anywhere;
    }

    pre {
      margin: 16px 0 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--fg);
      font: 12.5px/1.6 ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      min-height: 96px;
    }

    pre.is-error {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    a {
      color: var(--accent);
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <!--
    Dev-only seed page. Not referenced by manifest.json or any UI.

    The inline script below is intentional for this throwaway tool. Note that a
    normal MV3 extension page runs with the default script-src 'self' policy, so
    Chrome blocks inline scripts there; this page is meant for a local dev copy
    whose CSP allows it (or for a browser that relaxes extension-page CSP).
  -->
  <main class="wrap">
    <h1>PageGloss 演示数据</h1>
    <p>
      写入 3 个站点的人造标注，用来验证数据页的站点分组、每页 10 行的标题分页、
      5 × 10 的标注矩阵分页，以及悬停解释 / 笔记浮层。写入的是普通数据，不带任何 demo 字段。
    </p>
    <p>写入后可打开 <a href="../src/data/data.html" target="_blank" rel="noopener">src/data/data.html</a> 查看效果。</p>
    <p class="caveat">
      注意：MV3 扩展页面的默认 CSP 是 <code>script-src 'self'</code>，会拦截本页的内联脚本。
      若按钮没有反应，请在 DevTools 控制台里运行本页脚本，或使用放宽了 CSP 的开发副本。
    </p>
    <p class="current" id="current">正在读取当前缓存…</p>

    <div class="buttons">
      <button class="primary" id="seed" type="button">写入演示数据</button>
      <button id="clear" type="button">清空全部数据</button>
    </div>

    <pre id="output" role="status" aria-live="polite">尚未写入。点击「写入演示数据」开始。</pre>
  </main>

  <script src="../src/shared/messages.js"></script>
  <script src="../src/shared/i18n.js"></script>
  <script src="../src/shared/storage.js"></script>
  <script src="seed-demo.js"></script>
</body>
</html>
