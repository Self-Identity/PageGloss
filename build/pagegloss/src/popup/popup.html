<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageGloss</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header class="head">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19v13.5H6.5A2.5 2.5 0 0 0 4 20z"></path>
          <path d="M4 6.5V20"></path>
          <path d="M8 8.5h7M8 12h5"></path>
        </svg>
      </span>
      <div class="titles">
        <h1 id="title"></h1>
        <p class="sub" id="status"></p>
      </div>
      <label class="switch" title="">
        <input type="checkbox" id="enabled">
        <span class="slider" aria-hidden="true"></span>
      </label>
    </header>

    <p class="notice" id="notice" hidden></p>

    <section class="card">
      <h2 id="modeTitle"></h2>
      <div class="modes" id="modes" role="radiogroup"></div>
      <p class="hint" id="modeHint"></p>
    </section>

    <section class="card">
      <div class="row-between">
        <h2 id="marksTitle"></h2>
        <span class="badge" id="marksCount">0</span>
      </div>
      <ul class="notes" id="notes"></ul>
      <p class="empty" id="notesEmpty" hidden></p>
      <div class="pager" id="notesPager" role="group" hidden>
        <button class="btn pager-btn" id="notesPrev" type="button"></button>
        <span class="pager-info" id="notesPageInfo"></span>
        <button class="btn pager-btn" id="notesNext" type="button"></button>
      </div>
      <p class="notes-status" id="notesStatus" role="status" aria-live="polite" hidden></p>
      <button class="btn block" id="viewAllData" type="button"></button>
      <button class="btn danger block" id="clearPage" type="button"></button>
    </section>

    <section class="card">
      <div class="row-between">
        <h2 id="llmTitle"></h2>
        <span class="badge" id="llmState"></span>
      </div>
      <p class="hint" id="llmHint"></p>
      <button class="btn block" id="openOptions" type="button"></button>
    </section>

    <footer class="foot">
      <span id="version"></span>
      <a href="#" id="help" target="_blank" rel="noopener noreferrer"></a>
    </footer>
  </div>
  <script src="../shared/messages.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
