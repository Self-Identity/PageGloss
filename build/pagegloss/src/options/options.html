<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageGloss</title>
  <link rel="stylesheet" href="../styles/ui.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H19v13.5H6.5A2.5 2.5 0 0 0 4 20z"></path>
            <path d="M4 6.5V20"></path>
            <path d="M8 8.5h7M8 12h5"></path>
          </svg>
        </span>
        <div class="brand-text">
          <h1 id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="save-state" id="saveState" role="status" aria-live="polite"></span>
        <button class="btn" id="test" type="button"></button>
      </div>
    </header>

    <main class="grid">
      <section class="card" id="apiCard">
        <h2 id="apiTitle"></h2>

        <div class="field">
          <label for="baseUrl" id="baseUrlLabel"></label>
          <input type="url" id="baseUrl" spellcheck="false" autocomplete="off" placeholder="https://api.deepseek.com">
          <p class="hint" id="baseUrlHint"></p>
          <p class="hint resolved" id="resolvedEndpoint" hidden></p>
        </div>

        <div class="field">
          <label for="apiKey" id="apiKeyLabel"></label>
          <div class="input-row">
            <input type="password" id="apiKey" spellcheck="false" autocomplete="off" placeholder="sk-...">
            <button class="btn ghost" id="toggleKey" type="button"></button>
          </div>
          <p class="hint" id="apiKeyHint"></p>
        </div>

        <div class="field">
          <label for="model" id="modelLabel"></label>
          <div class="input-row">
            <input type="text" id="model" spellcheck="false" autocomplete="off" placeholder="deepseek-chat">
            <button class="btn ghost" id="fetchModels" type="button"></button>
          </div>
          <div class="model-picker">
            <button class="model-toggle" id="modelToggle" type="button" aria-expanded="false" hidden></button>
            <ul class="model-list" id="modelList" role="listbox" hidden></ul>
          </div>
        </div>

        <div class="field two-col">
          <div>
            <label for="temperature" id="temperatureLabel"></label>
            <div class="range-row">
              <input type="range" id="temperature" min="0" max="1.5" step="0.05">
              <output id="temperatureValue" for="temperature">0.3</output>
            </div>
          </div>
          <div>
            <label for="maxTokens" id="maxTokensLabel"></label>
            <input type="number" id="maxTokens" min="64" max="32000" step="32">
          </div>
        </div>

        <label class="check" for="stream">
          <input type="checkbox" id="stream">
          <span id="streamLabel"></span>
        </label>

        <div class="field">
          <div class="row-between">
            <label for="systemPrompt" id="systemPromptLabel"></label>
            <span class="inline-actions">
              <button class="btn ghost small" id="showDefaultPrompt" type="button"></button>
              <button class="btn ghost small" id="resetPrompt" type="button"></button>
            </span>
          </div>
          <textarea id="systemPrompt" rows="6" spellcheck="false"></textarea>
          <p class="hint" id="systemPromptHint"></p>
        </div>
      </section>

      <section class="card" id="contextCard">
        <h2 id="contextTitle"></h2>

        <div class="field">
          <label for="maxContextChars" id="maxContextLabel"></label>
          <input type="number" id="maxContextChars" min="500" max="200000" step="500">
        </div>

        <div class="field">
          <label id="matchModeLabel"></label>
          <div class="modes match-modes" id="matchModes" role="radiogroup">
            <label class="mode"><input type="radio" name="pg-match-mode" value="smart"><span id="matchModeSmart"></span></label>
            <label class="mode"><input type="radio" name="pg-match-mode" value="loose"><span id="matchModeLoose"></span></label>
            <label class="mode"><input type="radio" name="pg-match-mode" value="strict"><span id="matchModeStrict"></span></label>
          </div>
          <p class="hint" id="matchModeHint"></p>
        </div>

        <label class="check" for="markSentenceTokens">
          <input type="checkbox" id="markSentenceTokens">
          <span id="markSentenceTokensLabel"></span>
        </label>

        <label class="check" for="cardHoverOpen">
          <input type="checkbox" id="cardHoverOpen">
          <span id="cardHoverOpenLabel"></span>
        </label>

        <label class="check" for="selectionButton">
          <input type="checkbox" id="selectionButton">
          <span id="selectionButtonLabel"></span>
        </label>
        <p class="hint" id="selectionButtonHint"></p>

        <div class="field">
          <label for="markHotkey" id="markHotkeyLabel"></label>
          <div class="input-row">
            <input type="text" id="markHotkey" readonly spellcheck="false" autocomplete="off" placeholder="Alt+Q">
            <button class="btn ghost" id="resetHotkey" type="button"></button>
          </div>
          <p class="hint" id="markHotkeyHint"></p>
        </div>

        <div class="field">
          <label for="language" id="languageLabel"></label>
          <select id="language">
            <option value="auto"></option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </section>

      <section class="card" id="dataCard">
        <h2 id="dataTitle"></h2>
        <p class="hint" id="cacheSummary"></p>
        <p class="hint" id="dataViewHint"></p>
        <div class="button-row">
          <button class="btn primary" id="viewData" type="button"></button>
          <button class="btn" id="export" type="button"></button>
          <button class="btn" id="import" type="button"></button>
          <button class="btn danger" id="clearAll" type="button"></button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </section>
    </main>
    <a class="github-chip" href="https://github.com/Self-Identity" target="_blank" rel="noopener noreferrer"
       title="github.com/Self-Identity" aria-label="GitHub: Self-Identity">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
        <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"></path>
      </svg>
      <span>GitHub · Self-Identity</span>
    </a>
  </div>
  <script src="../shared/messages.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/ui.js"></script>
  <script src="options.js"></script>
</body>
</html>
